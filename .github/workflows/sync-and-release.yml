name: Sync Upstream and Release

on:
  schedule:
    # A: catch major-version unpack (~06:15 CST). Story runs 10m earlier.
    - cron: '40 0 * * *'  # 08:40 CST
    # B: catch minor flash-update (~16:00 CST). Story runs 10m earlier.
    - cron: '10 9 * * *'  # 17:10 CST
  workflow_dispatch:
    inputs:
      force_release:
        description: "Rebuild the current upstream commit through the release gate"
        required: false
        default: false
        type: boolean

concurrency:
  group: gamedata-release
  cancel-in-progress: false

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Get upstream latest commit SHA
        id: upstream
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(git ls-remote https://github.com/Kengxxiao/ArknightsGameData.git refs/heads/master | cut -f1)
          if [[ ! "${UPSTREAM_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream SHA: ${UPSTREAM_SHA:-<empty>}"
            exit 1
          fi
          echo "sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${UPSTREAM_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=upstream-${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "Upstream SHA: ${UPSTREAM_SHA}"

      - name: Get latest release tag from this fork
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Latest release tag: ${TAG}"
          mkdir -p /tmp/latest-release
          if [ -n "${TAG}" ]; then
            gh release download "${TAG}" --repo "${{ github.repository }}" \
              --pattern manifest.json --dir /tmp/latest-release 2>/dev/null || true
          fi
          if [ -f /tmp/latest-release/manifest.json ]; then
            RELEASE_SHA=$(python3 -c 'import json; print(json.load(open("/tmp/latest-release/manifest.json")).get("upstream_commit", ""))')
          else
            RELEASE_SHA="${TAG#upstream-}"
            RELEASE_SHA="${RELEASE_SHA%-v2}"
          fi
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Latest release upstream SHA: ${RELEASE_SHA:-<none>}"

      - name: Check if update is needed
        id: check
        run: |
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"
          LATEST_SHA="${{ steps.latest_release.outputs.sha }}"
          FORCE_RELEASE="${{ github.event.inputs.force_release || 'false' }}"
          if [ "${LATEST_SHA}" = "${UPSTREAM_SHA}" ] && [ "${FORCE_RELEASE}" != "true" ]; then
            echo "No update needed: fork release tag matches upstream SHA."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed: upstream=${UPSTREAM_SHA}, latest_release_sha=${LATEST_SHA}"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream selected data
        if: steps.check.outputs.needed == 'true'
        run: |
          git remote add upstream https://github.com/Kengxxiao/ArknightsGameData.git
          git fetch upstream master --depth=1

          mkdir -p /tmp/upstream-data
          git archive upstream/master \
            zh_CN/gamedata/excel \
            zh_CN/gamedata/levels \
            zh_CN/resource_manifest_idx.json \
            | tar -x -C /tmp/upstream-data

          echo "Fetched upstream data:"
          du -sh /tmp/upstream-data/zh_CN/gamedata/excel || true
          du -sh /tmp/upstream-data/zh_CN/gamedata/levels || true
          ls -lh /tmp/upstream-data/zh_CN/resource_manifest_idx.json || true

      - name: Create and validate release assets
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          cd /tmp/upstream-data

          zip -qr /tmp/zh_CN-excel.zip zh_CN/gamedata/excel
          zip -qr /tmp/zh_CN-levels.zip zh_CN/gamedata/levels
          zip -q /tmp/zh_CN-resource-manifest.zip zh_CN/resource_manifest_idx.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          upstream_sha = os.environ['UPSTREAM_SHA']
          manifest = {
              'source': 'Kengxxiao/ArknightsGameData',
              'source_branch': 'master',
              'upstream_commit': upstream_sha,
              'region': 'zh_CN',
          }
          Path('/tmp/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          PREVIOUS_ARGS=()
          if [ -f /tmp/latest-release/manifest.json ]; then
            PREVIOUS_ARGS=(--previous-manifest /tmp/latest-release/manifest.json)
          fi
          python3 "$GITHUB_WORKSPACE/scripts/release_gate.py" finalize \
            --excel /tmp/zh_CN-excel.zip \
            --levels /tmp/zh_CN-levels.zip \
            --resource /tmp/zh_CN-resource-manifest.zip \
            --manifest /tmp/manifest.json \
            "${PREVIOUS_ARGS[@]}"
          python3 "$GITHUB_WORKSPACE/scripts/release_gate.py" verify \
            --excel /tmp/zh_CN-excel.zip \
            --levels /tmp/zh_CN-levels.zip \
            --resource /tmp/zh_CN-resource-manifest.zip \
            --manifest /tmp/manifest.json \
            "${PREVIOUS_ARGS[@]}"

          echo "Created assets:"
          ls -lh /tmp/zh_CN-excel.zip /tmp/zh_CN-levels.zip /tmp/zh_CN-resource-manifest.zip /tmp/manifest.json
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}

      - name: Stage, verify, and publish GitHub Release
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_SHA="${{ steps.upstream.outputs.sha }}"
          RELEASE_TAG="${{ steps.upstream.outputs.tag }}-v2"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          RELEASE_NAME="Game Data ${RELEASE_DATE}"

          cat > /tmp/release_notes.md <<EOF
          Upstream commit: ${UPSTREAM_SHA}

          Synced from [Kengxxiao/ArknightsGameData](https://github.com/Kengxxiao/ArknightsGameData) on ${RELEASE_DATE}.

          This release contains selected zh_CN game data archives:

          - zh_CN-excel.zip: zh_CN/gamedata/excel/
          - zh_CN-levels.zip: zh_CN/gamedata/levels/
          - zh_CN-resource-manifest.zip: zh_CN/resource_manifest_idx.json
          - manifest.json: release metadata and SHA-256 checksums
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Published release ${RELEASE_TAG} already exists; skipping create."
              exit 0
            fi
            gh release delete "${RELEASE_TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "${RELEASE_NAME}" \
            --notes-file /tmp/release_notes.md \
            /tmp/zh_CN-excel.zip \
            /tmp/zh_CN-levels.zip \
            /tmp/zh_CN-resource-manifest.zip \
            /tmp/manifest.json

          rm -rf /tmp/release-verify
          mkdir -p /tmp/release-verify
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/release-verify
          python3 scripts/release_gate.py verify \
            --excel /tmp/release-verify/zh_CN-excel.zip \
            --levels /tmp/release-verify/zh_CN-levels.zip \
            --resource /tmp/release-verify/zh_CN-resource-manifest.zip \
            --manifest /tmp/release-verify/manifest.json \
            --previous-manifest /tmp/latest-release/manifest.json
          gh release edit "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
