name: Sync AKDP and Release

on:
  schedule:
    # A: catch major-version unpack (~06:15 CST). Story runs 10m earlier.
    - cron: '40 0 * * *'  # 08:40 CST
    # B: catch minor flash-update (~16:00 CST). Story runs 10m earlier.
    - cron: '10 9 * * *'  # 17:10 CST
  workflow_dispatch:
    inputs:
      force_release:
        description: "Re-download and re-verify the current AKDP release"
        required: false
        default: false
        type: boolean

concurrency:
  group: gamedata-release
  cancel-in-progress: false

env:
  AKDP_REPO: 3aKHP/arknights-data-pipeline

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve latest AKDP release
        id: akdp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AKDP_TAG=$(gh release list --repo "${AKDP_REPO}" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName')
          if [ -z "${AKDP_TAG}" ]; then
            echo "No non-draft AKDP release found."
            exit 1
          fi
          echo "tag=${AKDP_TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p /tmp/akdp
          gh release download "${AKDP_TAG}" --repo "${AKDP_REPO}" \
            --pattern manifest.json --dir /tmp/akdp

          VERSION_ID=$(python3 -c \
            "import json; print(json.load(open('/tmp/akdp/manifest.json'))['source']['versionId'])")
          COMPAT_TAG="akdp-${VERSION_ID}-v1"
          echo "version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "compat_tag=${COMPAT_TAG}" >> "$GITHUB_OUTPUT"
          echo "AKDP release: ${AKDP_TAG}  compat tag: ${COMPAT_TAG}"

      - name: Check if update is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMPAT_TAG="${{ steps.akdp.outputs.compat_tag }}"
          FORCE_RELEASE="${{ github.event.inputs.force_release || 'false' }}"

          if gh release view "${COMPAT_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${COMPAT_TAG}" --repo "${{ github.repository }}" \
              --json isDraft --jq .isDraft)
            if [ "${IS_DRAFT}" != "true" ] && [ "${FORCE_RELEASE}" != "true" ]; then
              echo "No update needed: ${COMPAT_TAG} is already published."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${COMPAT_TAG} exists (draft=${IS_DRAFT}, force=${FORCE_RELEASE}); will re-verify."
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Download and verify AKDP assets
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          AKDP_TAG="${{ steps.akdp.outputs.tag }}"
          mkdir -p /tmp/assets
          gh release download "${AKDP_TAG}" --repo "${AKDP_REPO}" \
            --pattern manifest.json \
            --pattern zh_CN-excel.zip \
            --pattern zh_CN-levels.zip \
            --dir /tmp/assets

          python3 scripts/akdp_source.py verify \
            --factory-manifest /tmp/assets/manifest.json \
            --asset "zh_CN-excel.zip=/tmp/assets/zh_CN-excel.zip" \
            --asset "zh_CN-levels.zip=/tmp/assets/zh_CN-levels.zip"

          echo "Verified AKDP assets:"
          ls -lh /tmp/assets

      - name: Build manifest and run release gate
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/akdp_source.py provenance \
            --factory-manifest /tmp/assets/manifest.json \
            --contract prts-gamedata-v1 > /tmp/provenance.json

          # Seed the compat manifest with factory provenance fields.
          cp /tmp/provenance.json /tmp/manifest.json

          # Fetch previous release manifest for regression check.
          mkdir -p /tmp/latest-release
          PREV_TAG=$(gh release list --repo "${{ github.repository }}" --exclude-drafts \
            --limit 1 --json tagName --jq '.[0].tagName // ""')
          PREVIOUS_ARGS=()
          if [ -n "${PREV_TAG}" ]; then
            gh release download "${PREV_TAG}" --repo "${{ github.repository }}" \
              --pattern manifest.json --dir /tmp/latest-release 2>/dev/null || true
            if [ -f /tmp/latest-release/manifest.json ]; then
              PREVIOUS_ARGS=(--previous-manifest /tmp/latest-release/manifest.json)
            fi
          fi

          python3 scripts/release_gate.py finalize \
            --excel /tmp/assets/zh_CN-excel.zip \
            --levels /tmp/assets/zh_CN-levels.zip \
            --manifest /tmp/manifest.json \
            "${PREVIOUS_ARGS[@]}"
          python3 scripts/release_gate.py verify \
            --excel /tmp/assets/zh_CN-excel.zip \
            --levels /tmp/assets/zh_CN-levels.zip \
            --manifest /tmp/manifest.json \
            "${PREVIOUS_ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage, verify, and publish GitHub Release
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMPAT_TAG="${{ steps.akdp.outputs.compat_tag }}"
          VERSION_ID="${{ steps.akdp.outputs.version_id }}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          RELEASE_NAME="Game Data ${RELEASE_DATE}"

          # If the tag already exists as a published (non-draft) release,
          # re-verify the published assets match and no-op.
          if gh release view "${COMPAT_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${COMPAT_TAG}" --repo "${{ github.repository }}" \
              --json isDraft --jq .isDraft)
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "Published release ${COMPAT_TAG} already exists; re-verify and skip."
              rm -rf /tmp/release-verify
              mkdir -p /tmp/release-verify
              gh release download "${COMPAT_TAG}" --repo "${{ github.repository }}" --dir /tmp/release-verify
              python3 scripts/release_gate.py verify \
                --excel /tmp/release-verify/zh_CN-excel.zip \
                --levels /tmp/release-verify/zh_CN-levels.zip \
                --manifest /tmp/release-verify/manifest.json \
                --previous-manifest /tmp/latest-release/manifest.json
              echo "Verified existing published release. No-op."
              exit 0
            fi
            echo "Removing stale draft ${COMPAT_TAG} before retry."
            gh release delete "${COMPAT_TAG}" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi

          cat > /tmp/release_notes.md <<EOF
          AKDP projection of factory release \`$(echo "${{ steps.akdp.outputs.tag }}")\`.

          Source: [${AKDP_REPO}](https://github.com/${AKDP_REPO})
          Factory versionId: \`${VERSION_ID}\`

          This release contains zh_CN game data archives projected from AKDP
          factory output. The zip bytes are identical to the factory release.

          - zh_CN-excel.zip: zh_CN/gamedata/excel/
          - zh_CN-levels.zip: zh_CN/gamedata/levels/
          - manifest.json: release metadata, provenance, and SHA-256 checksums

          \`zh_CN-resource-manifest.zip\` is a legacy optional asset not produced
          by the current AKDP factory; it is intentionally absent.
          EOF

          gh release create "${COMPAT_TAG}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "${RELEASE_NAME}" \
            --notes-file /tmp/release_notes.md \
            /tmp/assets/zh_CN-excel.zip \
            /tmp/assets/zh_CN-levels.zip \
            /tmp/manifest.json

          rm -rf /tmp/release-verify
          mkdir -p /tmp/release-verify
          gh release download "${COMPAT_TAG}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/release-verify
          python3 scripts/release_gate.py verify \
            --excel /tmp/release-verify/zh_CN-excel.zip \
            --levels /tmp/release-verify/zh_CN-levels.zip \
            --manifest /tmp/release-verify/manifest.json \
            --previous-manifest /tmp/latest-release/manifest.json
          gh release edit "${COMPAT_TAG}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
